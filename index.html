<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DPM Inteligente — Demonstração Fictícia</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1422;color:#edf2fa;font:16px system-ui,Arial}.wrap{max-width:920px;margin:auto;padding:36px 20px}header{border-bottom:1px solid #334256;padding-bottom:20px}h1{color:#dfb76f}p{line-height:1.6;color:#b5c3d3}.card{background:#152338;border:1px solid #344b63;border-radius:14px;padding:24px;margin-top:22px}button{background:#dfb76f;border:0;border-radius:8px;padding:13px 20px;color:#101722;font-weight:800;cursor:pointer}select{padding:12px;border-radius:8px;background:#0b1422;color:#fff;border:1px solid #63758b;width:100%;margin:10px 0 20px}pre{white-space:pre-wrap;line-height:1.7;color:#d8e5f4;font:inherit}.note{color:#f2c97f;font-size:13px}</style></head><body><div class="wrap"><header><h1>DPM Inteligente <small style="font-size:14px;color:#a6b6c9">DEMO</small></h1><p>Simulação pública de análise documental — sem acesso ao sistema de trabalho, sem IA externa e sem upload de arquivos.</p></header><div class="card"><h2>Escolha um protocolo fictício</h2><select id="sample"><option value="0">Protocolo fictício 001 — Solicitação de informação</option><option value="1">Protocolo fictício 002 — Atualização cadastral</option><option value="2">Protocolo fictício 003 — Encaminhamento interno</option></select><button id="analyze">Gerar análise demonstrativa</button><p class="note">Todas as informações e respostas desta página são inventadas para fins de portfólio.</p></div><div class="card" id="result" hidden><h2>Resultado demonstrativo</h2><pre id="output"></pre></div></div><script>const samples=[{name:'Solicitação de informação',summary:'Documento fictício solicita informações gerais sobre um procedimento administrativo.',points:'Identificar unidade responsável; confirmar prazo de resposta; verificar documentos necessários.',reply:'Acusar recebimento e encaminhar a solicitação para conferência pela área competente.'},{name:'Atualização cadastral',summary:'Documento fictício solicita atualização de dados cadastrais sem qualquer dado pessoal real.',points:'Conferir campos solicitados; validar autorização; registrar alteração simulada.',reply:'Informar que a solicitação está sujeita à conferência documental.'},{name:'Encaminhamento interno',summary:'Documento fictício trata do encaminhamento de uma demanda entre setores.',points:'Identificar assunto; registrar setor de destino; acompanhar retorno.',reply:'Registrar encaminhamento interno e informar a unidade destinatária.'}];document.getElementById('analyze').onclick=()=>{const s=samples[document.getElementById('sample').value];document.getElementById('output').textContent='ASSUNTO: '+s.name+'\n\nRESUMO\n'+s.summary+'\n\nPONTOS DE ATENÇÃO\n'+s.points+'\n\nMINUTA DE RESPOSTA (EXEMPLO)\n'+s.reply+'\n\nAVISO: resultado pré-escrito e inteiramente fictício; não representa análise automática real.';document.getElementById('result').hidden=false};</script></body></html>
